name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Run unit tests
        # Spike is an isolated Chaquopy app with product flavors; do not
        # require its Python wheel resolve on every product CI run.
        run: ./gradlew testDebugUnitTest -x :spikes:chaquopy-wheels:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
